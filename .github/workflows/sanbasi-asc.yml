# サンバーシ：App Store の掲載情報を API で入れる。app/ASC に inspect / apply / fix / submit などを書いて push で動く
# 結果は sanbasi-asc-out ブランチの asc.txt（公開リポジトリなので 個人の連絡先は ここでは扱わない）
name: sanbasi-asc
on:
  push:
    branches: [main]
    paths: ["app/ASC"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sanbasi-asc
jobs:
  asc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          ASC_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: FLAJQ8V396
          ASC_ISSUER_ID: 2fa8da34-49c0-4c52-aae7-77f748a041f7
        run: |
          mkdir -p /tmp/out
          printf '%s\n' "$ASC_P8" | tr -d '\r' | sed 's/^[ \t]*//;s/[ \t]*$//' | sed '/^$/d' > /tmp/asc.p8
          if ! head -1 /tmp/asc.p8 | grep -q BEGIN; then B=$(tr -d ' \n' < /tmp/asc.p8); printf -- '-----BEGIN PRIVATE KEY-----\n%s\n-----END PRIVATE KEY-----\n' "$(echo "$B" | fold -w 64)" > /tmp/asc.p8; fi
          pip install -q pyjwt cryptography
          for M in $(sed 's/#.*//' app/ASC); do echo "== $M" | tee -a /tmp/out/asc.txt; MODE="$M" ASC_P8_PATH=/tmp/asc.p8 python3 app/scripts/asc_listing.py || true; done
      - name: publish
        if: always()
        run: |
          rm -f /tmp/asc.p8
          git config user.name "app-bot"; git config user.email "app-bot@users.noreply.github.com"
          git checkout -q --orphan asc-tmp; git rm -rf -q . ; rm -rf ./* ./.github
          cp /tmp/out/* . 2>/dev/null || true; git add -A; git commit -q -m "asc ${GITHUB_SHA}" || true; git push -f -q origin HEAD:sanbasi-asc-out
